[project]
name = "sparse-readout-prism"
version = "0.2.2"
description = "Sparse Readout Prism: decomposes a language model's readout (the unembedding matrix) into sparse readout features and expresses any token logit or logit difference as signed feature contributions plus an explicit residual, with fidelity diagnostics."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Matteo He", email = "mh2274@cam.ac.uk" },
    { name = "William F. Shen" },
    { name = "Xinchi Qiu" },
    { name = "Nicholas D. Lane" },
]
requires-python = ">=3.11,<3.13"
keywords = [
    "mechanistic-interpretability",
    "sparse-autoencoders",
    "language-models",
    "unembedding",
    "logit-lens",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.5,<3",
    "transformers>=5.0,<6",
    "accelerate>=1.0,<2",  # required by scripts/data/extract_model_readout.py (device_map="auto")
    "numpy>=1.26,<3",
    "scipy>=1.15.3,<2",  # scripts/eval/dense_control_diagnostic.py (scipy.optimize.nnls)
    "datasets>=4.8.4,<5",  # scripts/data/extract_model_readout.py + build_query_banks.py
    "pyyaml>=6,<7",  # config loading in utils.py + research/registry.py (was only transitive)
    "pandas>=2.2,<3",  # scripts/eval/analyze_error_tails.py (CSV aggregation)
    "scikit-learn>=1.5,<2",  # scripts/run/run_wsd_feature_alignment.py + scripts/analyze/analyze_wsd_*.py
]

[project.urls]
Homepage      = "https://github.com/hematteo/sparse-readout-prism"
Repository    = "https://github.com/hematteo/sparse-readout-prism"
Issues        = "https://github.com/hematteo/sparse-readout-prism/issues"
Documentation = "https://github.com/hematteo/sparse-readout-prism#documentation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the git-sourced `lens` extra above.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sparse_readout_prism"]

# Torch resolves to the default PyPI build on every platform (CPU/MPS wheels on
# macOS, CUDA wheels on Linux). If your GPU needs a specific CUDA build, add a
# [tool.uv.sources] torch pin to a download.pytorch.org index locally and re-lock.

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.7",
]
# Jacobian-lens reference implementation (Apache-2.0, not on PyPI). Needed only
# by the cross-lens study scripts (scripts/run/fit_jlens.py and friends), which
# import it lazily so the rest of the repo installs and tests without it.
lens = [
    "jlens @ git+https://github.com/anthropics/jacobian-lens",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative default: pyflakes (F) catches real bugs (unused imports / vars,
# undefined names); a small subset of pycodestyle (E) covers indentation +
# import placement.
select = ["F", "E4", "E7", "E9", "W"]
ignore = [
    "E741",  # ambiguous variable names — common in math-heavy research code
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
