# Registry of the selected readout-factorizer checkpoints: the dictionaries
# the paper cites and the manifest behind the README table, docs/DATA.md and
# the Hub model card. ("Experiment 2" is the file's historical name.)
#
# Selection source: Appendix C (Table tab:app-k-model-finalists) and the
#   Appendix F reproducibility notes; the Gemma, Ministral and R1-Distill
#   points are reported in Appendix E.
# Extraction space (all models): final-norm output immediately before the
#   LM head (validated by lm_head pre-hook; bf16 readout precision floor noted).
#   logit = h @ W_U.T ; W_U is the model's final readout matrix.
#
# Every entry with a `hub_path` is published on the Hugging Face Hub at
# `huggingface_repo`, laid out as <model>/<operating_point>/checkpoint.pt
# (download with huggingface_hub.hf_hub_download(huggingface_repo, hub_path)).
# The `checkpoint:` paths are the canonical training-archive locations under
# ${SRP_ARCHIVE_ROOT}/ and are not needed to use the published files; `size`
# is the on-disk checkpoint.pt.
#
# Metrics are held-out replacement fidelity: rowEV = row-centered explained
# variance of the reconstructed unembedding rows, top1 = argmax agreement of
# the reconstructed readout with the original, KL = readout KL in bits. The
# Gemma top1/KL are computed through the model's final-logit softcap.
#
# The Pythia-160M continuity anchor uses a legacy state-dict schema and is
# NOT published on the Hub. No code reads this file.

huggingface_repo: hematteo/sparse-readout-prism
archive_root: ${SRP_ARCHIVE_ROOT}

headline:
  model: Qwen3.5-9B
  hf_id: Qwen/Qwen3.5-9B
  d_model: 4096
  vocab: 248320
  # The exact HF weight revision was not recorded at extraction time — the
  # extraction used the latest revision as of the paper runs. Rerun
  # scripts/data/extract_model_readout.py with --revision to pin explicitly.
  hf_revision: null
  operating_points:
    - id: qwen9b_k128_fixed
      role: headline fixed-budget (primary; k_audit)
      width: 8x
      d_features: 32768
      k: 128
      rowEV: 0.621
      top1: 0.846
      KL: 0.296
      hub_path: qwen3.5-9b/k128_8x/checkpoint.pt
      checkpoint: survivors/qwen9b_fixed_k128_ev_rescue/converged/topk_d32768_k128_rowseeded_hybrid_lamramp_s0/checkpoint.pt
      size: 1.0G
      verified: true
    - id: qwen9b_k256_16x
      role: compact k=256 capacity comparison
      width: 16x
      d_features: 65536
      k: 256
      rowEV: 0.761
      top1: 0.874
      KL: 0.167
      hub_path: qwen3.5-9b/k256_16x/checkpoint.pt
      checkpoint: no_pca_width_k_sweep/converged/topk_d65536_k256_rowseeded_hybrid_lamramp_s0/checkpoint.pt
      size: 2.0G
      verified: true
    - id: qwen9b_k256_32x
      role: strongest 9B capacity point (secondary)
      width: 32x
      d_features: 131072
      k: 256
      rowEV: 0.857
      top1: 0.900
      KL: 0.105
      hub_path: qwen3.5-9b/k256_32x/checkpoint.pt
      checkpoint: survivors/qwen9b_no_pca_width_k_sweep/converged/topk_d131072_k256_rowseeded_hybrid_lamramp_s0/checkpoint.pt
