# Experiment 2 (Benchmark-Derived Contrastive Margin Benchmark)
# Registry of the selected readout-factorizer checkpoints from Appendix C.
#
# Selection source: Appendix C (Table tab:app-k-model-finalists) + the Appendix F reproducibility notes
# Extraction space (all Qwen/Gemma): final RMSNorm output immediately before the
#   LM head (validated by lm_head pre-hook; bf16 readout precision floor noted).
#   logit = h @ W_U.T ; W_U is the model's final readout matrix.
#
# PATH NOTE: the selected checkpoints are published on the Hugging Face Hub at
# `huggingface_repo` below, laid out as <model>/<operating_point>/checkpoint.pt
# (e.g. qwen2b_k256 -> qwen3.5-2b/k256_32x/checkpoint.pt; qwen9b_k128_fixed ->
# qwen3.5-9b/k128_8x). The `checkpoint:` paths below are the canonical training
# archive locations under ${SRP_ARCHIVE_ROOT}/; sizes are the on-disk checkpoint.pt.
# The Pythia-160M continuity anchor uses a legacy state-dict schema and is NOT
# published on the Hub.

huggingface_repo: hematteo/sparse-readout-prism
archive_root: ${SRP_ARCHIVE_ROOT}

headline:
  model: Qwen3.5-9B
  d_model: 4096
  vocab: 248320
  # Base weights: Qwen/Qwen3.5-9B (see result1_query_fidelity_cluster.yaml).
  # The exact HF weight revision was not recorded at extraction time — the
  # extraction used the latest revision as of the paper runs. Rerun
  # scripts/data/extract_model_readout.py with --revision to pin explicitly.
  hf_revision: null
  operating_points:
    - id: qwen9b_k128_fixed
      role: headline fixed-budget (primary; k_audit)
      width: 8x
      d_features: 32768
      k: 128
      rowEV: 0.621
      top1: 0.846
      KL: 0.296
      checkpoint: survivors/qwen9b_fixed_k128_ev_rescue/converged/topk_d32768_k128_rowseeded_hybrid_lamramp_s0/checkpoint.pt
      size: 1.0G
      verified: true
    - id: qwen9b_k256_16x
      role: compact k=256 capacity comparison
      width: 16x
      d_features: 65536
      k: 256
      rowEV: 0.761
      top1: 0.874
      KL: 0.167
      checkpoint: no_pca_width_k_sweep/converged/topk_d65536_k256_rowseeded_hybrid_lamramp_s0/checkpoint.pt
      size: 2.0G
      verified: true
    - id: qwen9b_k256_32x
      role: strongest 9B capacity point (secondary)
      width: 32x
      d_features: 131072
      k: 256
      rowEV: 0.857
      top1: 0.900
      KL: 0.105
      checkpoint: survivors/qwen9b_no_pca_width_k_sweep/converged/topk_d131072_k256_rowseeded_hybrid_lamramp_s0/checkpoint.pt
      size: 4.0G
      verified: true

