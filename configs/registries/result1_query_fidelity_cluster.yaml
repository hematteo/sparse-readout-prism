# Result-1 five-model query-fidelity registry (cluster paths).
#
# Resolves W_U extraction artifacts and converged SAE checkpoints to their
# on-cluster locations under ${SRP_ARCHIVE_ROOT}. The runner skips
# any (model, operating_point) whose checkpoint file is missing, so partially
# synced runs degrade gracefully until their weights are present.
#
# Operating points:
#   fidelity      = fidelity-prioritized point  (32x, k=256)
#   strict_budget = strict-budget point         (16x/8x,  k=128)
#
# W_U_orig in each data/<m>/<m>.pt is the EXACT matrix the SAE was trained on
# (lm_head input via forward_pre_hook; Gemma post-readout tanh softcap recorded
# in the *_manifest.json, prism decomposes the pre-softcap readout).

# The trained checkpoints are published on the Hugging Face Hub at
# `huggingface_repo`, laid out as <model>/<operating_point>/checkpoint.pt
# (fidelity -> <model>/k256_32x, strict_budget -> <model>/k128_16x; qwen9b
# strict_budget -> qwen3.5-9b/k128_8x). The `checkpoint:` paths below remain the
# canonical on-cluster training locations.
huggingface_repo: matteohe/sparse-readout-prism
archive_root: ${SRP_ARCHIVE_ROOT}

models:
  Qwen3.5-0.8B:
    model_id: Qwen/Qwen3.5-0.8B
    revision: null
    w_u_artifact: data/qwen35-0p8b/qwen35_0p8b.pt
    manifest: data/qwen35-0p8b/qwen35_0p8b_manifest.json
    operating_points:
      fidelity:
        id: qwen0p8b_k256_32x
        checkpoint: results/qwen35_0p8b_sae/converge/topk_d32768_32x_k256_rowseeded_hybrid_lamramp_s0/checkpoint.pt
      strict_budget:
        id: qwen0p8b_k128_16x
        checkpoint: results/qwen35_0p8b_sae/converge/topk_d16384_16x_k128_rowseeded_hybrid_lamramp_s0/checkpoint.pt

