# Qwen3.5-0.8B readout SAE, 16x width, low activation-budget cells
# (tab:app-low-k-dead-features, the single-seed Q-0.8B rows k=32 and k=64).
# Same recipe as the seed-variation configs (TopK, 20000 steps, batch 4096,
# hybrid frequency/uniform row sampling); d_features fixed at 16384
# (16 x d_model 1024), seed 0.
#
# A launch overrides per cell via --set
#   factorizer.k / evaluation.k        the budget (evaluation.k = factorizer.k)
#   run.name / run.output_dir          qwen35_0p8b_d16384_k<k>_s0
# and nothing else.
#
# Paper cells (d_features, k, seed): (16384, 32, 0), (16384, 64, 0).
# The row-centred explained variance (rowEV) was not recorded for these two
# cells; the table enters it as ---.
#
# Example cell (k=32):
#   uv run python scripts/train/train_readout_sae_from_config.py \
#     --config configs/sweeps/lowk_qwen35_0p8b_16x_base.yaml \
#     --set factorizer.k=32 --set evaluation.k=32 \
#     --set run.output_dir=results/lowk_qwen35_0p8b_16x/qwen35_0p8b_d16384_k32_s0 \
#     --set run.name=qwen35_0p8b_d16384_k32_s0
#
# data.path is the {W_U_orig, h_LN} extraction of Qwen3.5-0.8B
# (scripts/data/extract_model_readout.py), the artifact
# configs/registries/result1_query_fidelity_cluster.yaml resolves for this model.

run:
  name: lowk_qwen35_0p8b_16x
  seed: 0
  init_seed: 0
  output_dir: results/lowk_qwen35_0p8b_16x/qwen35_0p8b_d16384_k64_s0
  device: auto

data:
  path: ${SRP_ARCHIVE_ROOT}/data/qwen35-0p8b/qwen35_0p8b.pt
  fallback: error
  max_rows: null
  max_hidden: 2048
  val_hidden: 512
  data_seed: 0

factorizer:
  architecture: topk
  d_features: 16384
  k: 64
  encoder_init_scale: 0.02

training:
  steps: 20000
  batch_size: 4096
  lr: 0.001
  weight_decay: 0.0001
  code_l2: 0.000001
  prism_top_n: 1
  lambda_prism: 0.001
  row_sampling: hybrid_50freq_50uniform

evaluation:
  k: 64
  max_eval_rows: 20000
  max_eval_hidden: 1024
  topk_overlap: 5
  contribution_top_k: 8

artifacts:
  save_checkpoint: true

autoresearch:
  score_thresholds:
    max_dead_feature_rate: 0.5
    max_val_logit_kl_bits_mean: 20.0
