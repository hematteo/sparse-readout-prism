# DeepSeek-R1-Distill-Llama-8B W_U-row SAE — PAPER-SCALE 16x/k128.
# Companion to deepseek_r1_distill_llama_8b_paper.yaml.

run:
  name: deepseek_r1_distill_llama_8b_paper_topk_16x_k128_s0
  seed: 0
  output_dir: results/experiments/proto_token_lens/deepseek_r1_distill_llama_8b_sae/topk_16x_k128_paper20k_s0
  device: auto

data:
  path: ${SRP_ARCHIVE_ROOT}/data/deepseek-r1-distill-llama-8b/deepseek_r1_distill_llama_8b.pt
  fallback: error
  max_rows: null
  max_hidden: 2048
  val_hidden: 512
  data_seed: 0

factorizer:
  architecture: topk
  d_features: 65536            # override at launch: --set factorizer.d_features=<16 * manifest d_model>
  k: 128
  encoder_init_scale: 0.02

training:
  steps: 20000
  batch_size: 4096
  lr: 0.001
  weight_decay: 0.0001
  code_l2: 0.000001
  prism_top_n: 1
  lambda_prism: 0.001
  row_sampling: hybrid_50freq_50uniform
  log_every: 250
  checkpoint_every: 5000

evaluation:
  max_eval_rows: 20000
  max_eval_hidden: 1024
  topk_overlap: 5
  contribution_top_k: 8
  k: 128

artifacts:
  save_checkpoint: true

autoresearch:
  score_thresholds:
    max_dead_feature_rate: 0.5
    max_val_logit_kl_bits_mean: 20.0
