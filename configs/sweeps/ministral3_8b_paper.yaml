# Ministral-3-8B-Base W_U-row SAE paper sweep config.
#
# TopK, 32x d_model, k=256, 20000 steps (matches the Qwen3.5-9B converged
# finalist horizon). Same data/sampling/optimizer recipe as the pilot.
#
# d_features PLACEHOLDER assumes d_model=4096 (32 * 4096 = 131072); the true
# value is read from the extraction manifest and injected by
# the launch command via `--set factorizer.d_features=<32 * manifest d_model>`
# (no launch wrapper ships with this repo; see configs/sweeps/README.md).
#
# Disk: run_experiment deletes train_ckpt.pt on completion, so the persistent
# footprint is only checkpoint.pt (~enc+dec, a few GB). The ~13 GB optimizer
# state exists only transiently mid-training (headroom ~35 GB after the
# 2026-05-19 train_ckpt reclaim — safe).

run:
  name: ministral3_8b_paper_topk_32x_k256_s0
  seed: 0
  output_dir: results/ministral3_8b_base_sae/topk_d131072_32x_k256_rowseeded_hybrid_s0
  device: auto

data:
  path: ${SRP_ARCHIVE_ROOT}/data/ministral3-8b-base/ministral3_8b_base.pt
  fallback: error
  max_rows: null
  max_hidden: 2048
  val_hidden: 512
  data_seed: 0
  row_preprocessing: center_normalize

factorizer:
  architecture: topk
  d_features: 131072           # override at launch: --set factorizer.d_features=<32 * manifest d_model>
  k: 256
  encoder_init_scale: 0.02

training:
  steps: 20000
  batch_size: 4096
  lr: 0.001
  weight_decay: 0.0001
  code_l2: 0.000001
  prism_top_n: 1
  lambda_prism: 0.001
  row_sampling: hybrid_50freq_50uniform
  log_every: 250
  checkpoint_every: 5000

evaluation:
  max_eval_rows: 20000
  max_eval_hidden: 1024
  topk_overlap: 5
  contribution_top_k: 8
  k: 256

artifacts:
  save_checkpoint: true

autoresearch:
  score_thresholds:
    max_dead_feature_rate: 0.5
    max_val_logit_kl_bits_mean: 20.0
