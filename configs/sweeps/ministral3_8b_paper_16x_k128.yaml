# Ministral-3-8B-Base W_U-row SAE — PAPER-SCALE 16x/k128 MATCHED-PROTOCOL
# (companion to ministral3_8b_paper.yaml). Same 20000-step protocol as the
# 32x/k256 paper variant; only d_features and k change. This is the
# strict_budget operating point in configs/registries/ (op id
# ministral_k128_16x, checkpoint dir topk_d65536_16x_k128_paper20k_s0).
#
# d_features PLACEHOLDER assumes d_model=4096 (16 * 4096 = 65536); the true
# value is read from the extraction manifest — override at launch with
# `--set factorizer.d_features=<16 * manifest d_model>`.

run:
  name: ministral3_8b_paper_topk_16x_k128_s0
  seed: 0
  output_dir: results/ministral3_8b_base_sae/topk_d65536_16x_k128_paper20k_s0
  device: auto

data:
  path: ${SRP_ARCHIVE_ROOT}/data/ministral3-8b-base/ministral3_8b_base.pt
  fallback: error
  max_rows: null
  max_hidden: 2048
  val_hidden: 512
  data_seed: 0
  row_preprocessing: center_normalize

factorizer:
  architecture: topk
  d_features: 65536            # override at launch: 16 * manifest d_model
  k: 128
  encoder_init_scale: 0.02

training:
  steps: 20000
  batch_size: 4096
  lr: 0.001
  weight_decay: 0.0001
  code_l2: 0.000001
  prism_top_n: 1
  lambda_prism: 0.001
  row_sampling: hybrid_50freq_50uniform
  log_every: 250
  checkpoint_every: 5000

evaluation:
  max_eval_rows: 20000
  max_eval_hidden: 1024
  topk_overlap: 5
  contribution_top_k: 8
  k: 128

artifacts:
  save_checkpoint: true

autoresearch:
  score_thresholds:
    max_dead_feature_rate: 0.5
    max_val_logit_kl_bits_mean: 20.0
